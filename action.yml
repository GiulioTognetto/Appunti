name: 'Notes Website Builder'
description: 'Platform-agnostic static website bundle generator from Markdown/Obsidian notes using Nuxt Content'
author: 'Giulio Tognetto'

branding:
  icon: 'book-open'
  color: 'green'

inputs:
  content-dir:
    description: 'Path in the caller repository where the markdown notes are located'
    required: false
    default: '.'
  base-url:
    description: 'Base URL for the website (leave empty to auto-detect: "/" for non-static presets or CNAME, "/<repo>/" for static GitHub Pages)'
    required: false
    default: ''
  nitro-preset:
    description: 'Nitro build preset (e.g. "static", "cloudflare-pages", "github-pages", "vercel")'
    required: false
    default: 'static'
  upload-artifact:
    description: 'Whether to upload the generated bundle as a GitHub Actions artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'website-build'
  github-token:
    description: 'GitHub token for Pages API detection when preset is static (defaults to github.token)'
    required: false
    default: ${{ github.token }}

outputs:
  output-dir:
    description: 'Path to the generated bundle directory in the workspace (dist/)'
    value: ${{ steps.set-output.outputs.output-dir }}
  base-url:
    description: 'The resolved base URL used to compile the site'
    value: ${{ steps.detect-base-url.outputs.base_url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install Website Dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile

    - name: Copy Content from Caller Repository
      shell: bash
      run: |
        CONTENT_SRC="${{ github.workspace }}/${{ inputs.content-dir }}"
        TARGET_DIR="${{ github.action_path }}/content"

        if [ ! -d "$CONTENT_SRC" ]; then
          echo "::error::Content directory '$CONTENT_SRC' does not exist!"
          exit 1
        fi

        echo "Copying notes from $CONTENT_SRC to $TARGET_DIR..."
        rm -rf "$TARGET_DIR"
        mkdir -p "$TARGET_DIR"

        # Sincronizza i file escludendo metadati git e configurazioni CI
        rsync -a --delete \
          --exclude '.git' \
          --exclude '.github' \
          "$CONTENT_SRC/" "$TARGET_DIR/"

        # Se nella cartella dei contenuti c'è una cartella public/ o un CNAME, copiali negli asset del sito
        if [ -f "$CONTENT_SRC/CNAME" ]; then
          echo "Found CNAME file in content, copying to public folder..."
          mkdir -p "${{ github.action_path }}/public"
          cp "$CONTENT_SRC/CNAME" "${{ github.action_path }}/public/CNAME"
        fi

        if [ -d "$CONTENT_SRC/public" ]; then
          echo "Found public directory in content, copying assets..."
          mkdir -p "${{ github.action_path }}/public"
          cp -r "$CONTENT_SRC/public/"* "${{ github.action_path }}/public/" 2>/dev/null || true
        fi

    - name: Resolve Base URL
      id: detect-base-url
      shell: bash
      run: |
        PRESET="${{ inputs.nitro-preset }}"
        INPUT_BASE_URL="${{ inputs.base-url }}"

        if [ -n "$INPUT_BASE_URL" ]; then
          RESOLVED_BASE_URL="$INPUT_BASE_URL"
          echo "Using explicitly provided base-url: $RESOLVED_BASE_URL"
        elif [ "$PRESET" != "static" ]; then
          # Qualsiasi preset non-static (es. cloudflare-pages, vercel, ecc.) viene servito alla radice
          echo "Preset is '$PRESET' (non-static). Defaulting base-url to '/'"
          RESOLVED_BASE_URL="/"
        elif [ -f "${{ github.workspace }}/CNAME" ] || [ -f "${{ github.action_path }}/public/CNAME" ]; then
          echo "CNAME detected for static preset. Setting base-url to '/'"
          RESOLVED_BASE_URL="/"
        elif [[ "${{ github.repository }}" == *.github.io ]]; then
          echo "GitHub Pages root site (*.github.io) detected. Setting base-url to '/'"
          RESOLVED_BASE_URL="/"
        else
          # Preset 'static' e nessun custom domain: rileva il nome del repository per GitHub Pages
          PAGES_INFO=$(curl -s -H "Authorization: Bearer ${{ inputs.github-token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" 2>/dev/null || true)
          CNAME=$(echo "$PAGES_INFO" | jq -r '.cname // empty' 2>/dev/null || true)

          if [ -n "$CNAME" ] && [ "$CNAME" != "null" ]; then
            echo "Custom domain detected via Pages API ($CNAME). Setting base-url to '/'"
            RESOLVED_BASE_URL="/"
          else
            REPO_NAME="${{ github.event.repository.name }}"
            if [ -z "$REPO_NAME" ]; then
              REPO_NAME=$(basename "${{ github.repository }}")
            fi
            echo "Standard GitHub repository detected for static preset. Setting base-url to '/$REPO_NAME/'"
            RESOLVED_BASE_URL="/$REPO_NAME/"
          fi
        fi

        # Normalizza gli slash (assicura leading e trailing slash corretti)
        if [[ "$RESOLVED_BASE_URL" != "/" && "$RESOLVED_BASE_URL" != */ ]]; then
          RESOLVED_BASE_URL="$RESOLVED_BASE_URL/"
        fi
        if [[ "$RESOLVED_BASE_URL" != /* ]]; then
          RESOLVED_BASE_URL="/$RESOLVED_BASE_URL"
        fi

        echo "Resolved BASE_URL: $RESOLVED_BASE_URL"
        echo "base_url=$RESOLVED_BASE_URL" >> "$GITHUB_OUTPUT"

    - name: Build Static Site
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        NUXT_APP_BASE_URL: ${{ steps.detect-base-url.outputs.base_url }}
        NITRO_PRESET: ${{ inputs.nitro-preset }}
      run: bun run generate

    - name: Export Output to Workspace
      id: set-output
      shell: bash
      run: |
        OUTPUT_SRC="${{ github.action_path }}/.output/public"
        TARGET_DIST="${{ github.workspace }}/dist"

        mkdir -p "$TARGET_DIST"
        rsync -a "$OUTPUT_SRC/" "$TARGET_DIST/"

        echo "output-dir=$TARGET_DIST" >> "$GITHUB_OUTPUT"

    - name: Upload Build Artifact
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.set-output.outputs.output-dir }}
        if-no-files-found: error

