name: Build & Deploy

on:
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Content Submodule
        run: |
          if [ -z "${{ vars.CONTENT_REPOSITORY_URL }}" ]; then
            echo "Error: the variable vars.CONTENT_REPOSITORY_URL is not set in GitHub settings!"
            exit 1
          fi

          URL="${{ vars.CONTENT_REPOSITORY_URL }}"
          if [ -n "${{ secrets.PERSONAL_TOKEN }}" ]; then
            URL=$(echo "$URL" | sed "s|https://|https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@|")
          fi

          git submodule deinit -f content 2>/dev/null || true
          git rm -f content 2>/dev/null || true
          
          rm -rf .git/modules/content content

          git submodule add -f "$URL" content
          git submodule update --init --recursive --remote

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Detect Base URL
        id: detect-base-url
        run: |
          PAGES_INFO=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || true)

          CNAME=$(echo "$PAGES_INFO" | jq -r '.cname // empty')

          if [ -n "$CNAME" ] && [ "$CNAME" != "null" ]; then
            echo "Custom domain rilevato ($CNAME). Imposto BASE_URL a '/'"
            echo "base_url=/" >> $GITHUB_OUTPUT
          else
            echo "Nessun custom domain rilevato. Imposto BASE_URL a '/${{ github.event.repository.name }}/'"
            echo "base_url=/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
          fi

      - name: Build Static Site
        run: bun run generate
        env:
          NUXT_APP_BASE_URL: ${{ steps.detect-base-url.outputs.base_url }}

      - name: Upload Artifacts (GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build-and-deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4